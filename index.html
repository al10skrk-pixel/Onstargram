const SAVE_KEY="onstagram_save_v1";
// 게시물 카드는 id만 저장해서 저장 용량을 줄입니다.
function slimChat(){return Object.fromEntries(K.map(k=>[k,S.chat[k].map(m=>(m.p&&(m.p.id!=null||m.hk))?{f:m.f,me:m.me,them:m.them,hk:m.hk,pid:m.p.id}:m)]))}
function hydrateChats(){K.forEach(k=>{S.chat[k].forEach(m=>{if(m.p)return;if(m.hk)m.p=HID[m.hk];else if(m.pid!=null)m.p=P.find(x=>x.id===m.pid)||EVP[m.pid]});S.chat[k]=S.chat[k].filter(m=>!((m.hk||m.pid!=null)&&!m.p))})}
function saveGameState(){
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify({
   aff:S.aff,chat:slimChat(),un:S.un,sent:S.sent,di:S.di,act:S.act,
   joined:S.joined,jb:S.jb,jq:S.jq,je:S.je,dayOff:S.dayOff,fs:S.fs,sto:S.sto,x:S.x,blocked:S.blocked,pl:S.pl,ts:S.ts,hid:S.hid,last:S.last,hist:S.hist,liked:S.liked,cm:S.cm,cl:S.cl,ev:S.ev,set:S.set
  }));
 }catch(e){console.warn("게임 저장 실패",e)}
}
const ZK=f=>Object.fromEntries(K.map(k=>[k,f(k)]));
function loadGameState(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw)return;
  const d=JSON.parse(raw);
  if(d.aff)S.aff=ZK(k=>typeof d.aff[k]==="number"?d.aff[k]:10);
