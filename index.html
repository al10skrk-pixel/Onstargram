// GitHub Pages에서도 새로고침 후 게임 진행/대화가 유지되도록 브라우저에 저장합니다.
const SAVE_KEY="onstagram_save_v1";
// 게시물 카드는 id만 저장해서 저장 용량을 줄입니다.
function slimChat(){return Object.fromEntries(K.map(k=>[k,S.chat[k].map(m=>(m.p&&(m.p.id!=null||m.hk))?{f:m.f,me:m.me,them:m.them,hk:m.hk,pid:m.p.id}:m)]))}
function hydrateChats(){K.forEach(k=>{S.chat[k].forEach(m=>{if(m.p)return;if(m.hk)m.p=HID[m.hk];else if(m.pid!=null)m.p=P.find(x=>x.id===m.pid)||EVP[m.pid]});S.chat[k]=S.chat[k].filter(m=>!((m.hk||m.pid!=null)&&!m.p))})}
function saveGameState(){
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify({
   aff:S.aff,chat:slimChat(),un:S.un,sent:S.sent,di:S.di,act:S.act,
   ts:S.ts,hid:S.hid,last:S.last,hist:S.hist,liked:S.liked,ev:S.ev,set:S.set
  }));
 }catch(e){console.warn("게임 저장 실패",e)}
}
const ZK=f=>Object.fromEntries(K.map(k=>[k,f(k)]));
function loadGameState(){
 try{
  const raw=localStorage.getItem(SAVE_KEY);
  if(!raw)return;
  const d=JSON.parse(raw);
  if(d.aff)S.aff=ZK(k=>typeof d.aff[k]==="number"?d.aff[k]:10);
  if(d.chat)S.chat=ZK(k=>Array.isArray(d.chat[k])?d.chat[k]:[]);
  if(d.un)S.un=ZK(k=>Number.isFinite(d.un[k])?d.un[k]:0);
  if(d.sent&&typeof d.sent==="object")S.sent=d.sent;
  if(d.di)S.di=ZK(k=>Number.isFinite(d.di[k])?d.di[k]:0);
  if(d.act)S.act={...S.act,...d.act};
  if(d.ts&&typeof d.ts==="object")S.ts=d.ts;
  if(d.hid&&typeof d.hid==="object")S.hid=d.hid;
  if(d.last&&typeof d.last==="object")S.last=d.last;
  if(d.hist)S.hist=ZK(k=>Array.isArray(d.hist[k])?d.hist[k]:[]);
  if(d.liked&&typeof d.liked==="object")S.liked=d.liked;
  if(d.ev&&typeof d.ev==="object")S.ev=d.ev;
  if(d.set&&typeof d.set==="object")S.set={...S.set,...d.set};
 }catch(e){console.warn("저장 데이터 불러오기 실패",e)}
 // 진행 중이던 자동 메시지/타이핑 상태는 새로고침 시 초기화합니다.
 S.busy=Z(()=>0);
 S.view="feed";
 S.cur=null;
 S.sheet=null;
 S.toast="";
 if(S.set.theme)document.documentElement.dataset.theme=S.set.theme;
}
loadGameState();
let saveTimer=0;
function queueSave(){
 clearTimeout(saveTimer);
 saveTimer=setTimeout(saveGameState,150);
}
window.addEventListener("beforeunload",saveGameState);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveGameState()});

let RV="";

  h=`<div class="chat"><header><button class="back" onclick="go('dm')">‹</button>${av(c,34)}<div style="flex:1;margin-left:10px;line-height:1.25"><b>${c.n}</b><div style="font-size:11px">최근 활동: ${ago(S.act[k])}</div></div><span style="font-size:12px">♥ ${S.aff[k]}</span></header>

  else if(t==="choice"){S.busy[k]=2;S.choice={k,opts:x,go:n=>{const o=x[n];S.choice=null;S.ts[k]=Date.now();S.chat[k].push({f:"me",t:fmt(o.text)});if(o.aff)add(k,o.aff);S.busy[k]=1;render();setTimeout(()=>play(o.lines,nx),g()*.7)}};render()}
  else nx()};nx()};
 play(e.lines,()=>{hr(k);S.busy[k]=0;render()})}
document.documentElement.dataset.theme=S.set.theme||"default";hydrateChats();render();
