const bg=p=>PIMG[p.c]?`url(${PIMG[p.c]}) center/cover`:p.intro?p.g:"var(--them)",fc=p=>PIMG[p.c]||!p.intro?"":p.e;
function pv(p){return `<div class="img" style="background:${bg(p)}">${fc(p)}${p.r?'<span class="rl">▶ 릴스</span>':''}${p.intro?`<small>${p.t}</small>`:''}</div>`}
const av=(c,z)=>`<div class="av" style="background:url(${c.img}) center/cover;${z?`width:${z}px;height:${z}px;font-size:${z/2}px`:''}"></div>`;
function render(){
 const un=Object.values(S.un).reduce((a,b)=>a+b,0),v=S.view;let h="";
 if(v==="chat"){const k=S.cur,c=C[k],L=S.chat[k];
  h=`<div class="chat"><header><button class="back" onclick="go('dm')">‹</button>${av(c,34)}<div style="flex:1;margin-left:10px;line-height:1.25"><b>${c.n}</b><div style="font-size:11px">최근 활동: ${ago(S.act[k])}</div></div><span style="font-size:12px">♥ ${S.aff[k]}</span></header>
  <div class="msgs" id="msgs">${L.map((m,i)=>{if(m.p&&m.them)return `<div class="row">${av(c,40)}<div><div class="nm">${c.n}</div><div class="m pc" style="align-self:flex-start">${pv(m.p)}<div class="c"><b>${m.p.u}</b> ${m.p.cap}</div></div></div></div>`;if(m.p)return `<div class="m pc">${pv(m.p)}<div class="c"><b>${m.p.u}</b> ${m.p.cap.slice(0,22)}…</div></div>`;
   if(m.f==="sys")return `<div class="m sys">${m.t}</div>`;
   if(m.f==="me")return `<div class="m me">${m.t}</div>`;
   const first=!L[i-1]||L[i-1].f!=="them";
   return `<div class="row">${first?av(c,40):'<div style="width:40px"></div>'}<div>${first?`<div class="nm">${c.n}</div>`:''}<div class="m them">${m.t}</div></div></div>`}).join("")}${S.busy[k]?`<div class="row">${av(c,40)}<div><div class="m them typing"><i></i><i></i><i></i></div></div></div>`:""}</div>
  <div class="bar"><input readonly placeholder="메시지 보내기…"><button onclick="daily('${k}')" ${S.busy[k]?'disabled style="opacity:.4"':''}>전송</button></div></div>`;
 }else{
  const T={feed:'<span class="logo">Onstagram</span>',reels:"릴스",dm:`친구 <span style="color:#fcff4f">${K.length}</span>`,search:"검색",profile:"내 프로필"};
  h=`<header><b style="font-size:20px">${T[v]}</b></header><div class="tabs">${[["feed",IC.home],["reels",IC.reels],["dm",IC.fish],["search",IC.hook],["profile",IC.ribbon]].map(([k,i])=>`<span class="${v===k?'on':''}" onclick="go('${k}')">${i}${k==='dm'&&un?`<b class="badge">${un}</b>`:''}</span>`).join("")}</div>`;
  if(v==="feed")h+=`<main>`+P.filter(p=>!p.r).map(p=>`<div class="post"><div class="ph"><div class="av" style="background:${p.g}">${p.e}</div>${p.u}</div>${pv(p)}<div class="acts"><button onclick="like(${p.id})">${S.liked[p.id]?'❤️':'🤍'}</button><button onclick="openSheet(${p.id})">✈️</button></div><div class="cap"><b>${p.u}</b>${p.cap.replace(/#(\S+)/g,'<span class="tag">#$1</span>')}</div></div>`).join("")+`</main>`;
  if(v==="reels")h+=`<main class="reels">${P.filter(p=>p.r).map(p=>`<div class="reel" style="background:${bg(p)}">${fc(p)}<div class="side"><button onclick="like(${p.id})">${S.liked[p.id]?'❤️':'🤍'}</button><button onclick="openSheet(${p.id})">✈️</button></div><div class="rc"><b>@${p.u}</b><br>${p.cap}</div></div>`).join("")}</main>`;
  if(v==="dm")h+=`<main><div style="padding:10px 14px"><div class="sb">🔍 검색</div></div><div class="sec3"><b>메시지</b><span>요청</span></div>${K.map(k=>{const c=C[k];return `<div class="dm" onclick="openChat('${k}')">${av(c)}<div class="t"><b>${c.n}</b><div class="l">최근 활동: ${ago(S.act[k])}</div></div>${S.un[k]?'<span class="dot"></span>':''}</div>`}).join("")}</main>`;
  if(v==="search")h+=`<main><div style="padding:10px"><div class="sb">🔍 검색</div></div><div class="grid">${P.map(p=>`<div style="background:${bg(p)}">${fc(p)}</div>`).join("")}</div></main>`;
  if(v==="profile"){const st=S.set,sg=(l,key,val)=>`<button class="${st[key]===val?'on':''}" onclick="setOpt('${key}',${JSON.stringify(val).replace(/"/g,"'")})">${l}</button>`;
